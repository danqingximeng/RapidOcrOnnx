<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字识别</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F7F9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="文字识别">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="icons/icon-192.png" alt="" width="26" height="26">
    <button id="preset-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
      <span>文字识别</span>
      <span id="preset-cur">(small)</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <polyline points="1,3.5 6,8.5 11,3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="preset-menu" role="menu" hidden></div>
  </div>
  <div class="header-right">
    <div class="health">
      <span id="health-dot" class="dot"></span>
      <span id="health-text">检测中</span>
    </div>
    <button id="sidebar-open" type="button" title="设置" aria-label="设置" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <line x1="2" y1="4.5" x2="16" y2="4.5"/>
        <line x1="2" y1="9" x2="16" y2="9"/>
        <line x1="2" y1="13.5" x2="16" y2="13.5"/>
        <circle cx="12" cy="4.5" r="2"/>
        <circle cx="6" cy="9" r="2"/>
        <circle cx="11" cy="13.5" r="2"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <section id="pane-image">
    <div id="img-toolbar" class="toolbar" hidden>
      <div class="toolbar-group">
        <button id="pick" class="btn" type="button">更换</button>
        <button id="clear" class="btn" type="button">清除</button>
        <button id="toggle-boxes" class="btn active" type="button" aria-pressed="true">检测框</button>
      </div>
    </div>
    <button id="dropzone" type="button">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 16V4m0 0-3.5 3.5M12 4l3.5 3.5"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <span>点击选择图片，或拖拽 / 粘贴到这里</span>
    </button>
    <div id="stage" hidden>
      <div id="frame">
        <img id="preview" alt="待识别图片">
        <svg id="overlay" aria-hidden="true"></svg>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </section>

  <section id="pane-result">
    <div id="result-toolbar" class="toolbar">
      <div class="toolbar-group">
        <div id="mode-seg" class="seg" role="radiogroup" aria-label="结果视图">
          <button class="seg-btn" data-mode="blocks" role="radio" aria-checked="false" disabled title="按框查看与选择">框</button>
          <button class="seg-btn active" data-mode="text" role="radio" aria-checked="true" disabled title="成文阅读与编辑">文</button>
        </div>
        <button id="select-all" class="btn" type="button" hidden>全选</button>
      </div>
      <button id="copy" class="btn primary" type="button" disabled>复制</button>
    </div>
    <div id="errorbar" hidden>
      <span id="error-text"></span>
      <button id="retry" class="btn small" type="button" hidden>重试</button>
    </div>
    <div id="output" class="mode-text">
      <p class="empty-hint">选择、拖拽或粘贴图片，识别结果显示在这里</p>
    </div>
    <div id="statusline"></div>
  </section>
</main>

<div id="sidebar-scrim" hidden></div>
<aside id="sidebar" aria-label="设置" hidden>
  <div id="sidebar-head">
    <span>设置</span>
    <button id="sidebar-close" type="button" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <line x1="3" y1="3" x2="13" y2="13"/>
        <line x1="13" y1="3" x2="3" y2="13"/>
      </svg>
    </button>
  </div>
  <div id="sidebar-body">
    <label class="field">
      <span>缩放</span>
      <select id="scale">
        <option value="1024" selected>长边 1024</option>
        <option value="0">原图</option>
      </select>
    </label>
    <label class="field">
      <span>排序</span>
      <select id="sort">
        <option value="gaptree" selected>阅读顺序</option>
        <option value="none">原始顺序</option>
      </select>
    </label>
    <label class="field">
      <span>换行</span>
      <select id="para">
        <option value="1" selected>段内拼接</option>
        <option value="0">逐框换行</option>
      </select>
    </label>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
